<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Sobre mim em formato de terminal">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2230"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <clipPath id="win"><rect x="0" y="0" width="1000" height="470" rx="16"/></clipPath>
    <style>
      .m { font: 500 18px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
      .title { font: 600 14px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: #8b949e; }
      .prompt { fill: #22c55e; } .path { fill: #60a5fa; } .cmd { fill: #e6edf3; }
      .out { fill: #c9d1d9; } .hl { fill: #a78bfa; font-weight: 700; } .str { fill: #fbbf24; }
      .line { opacity: 0; animation: show .35s ease-out forwards; }
      @keyframes show { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
      .l1 { animation-delay: .3s; } .l2 { animation-delay: .9s; }
      .l3 { animation-delay: 1.6s; } .l4 { animation-delay: 2.1s; } .l5 { animation-delay: 2.5s; } .l6 { animation-delay: 2.9s; }
      .l7 { animation-delay: 3.6s; } .l8 { animation-delay: 4.1s; }
      .l9 { animation-delay: 4.8s; } .l10 { animation-delay: 5.3s; }
      .l11 { animation-delay: 5.9s; }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#win)">
    <rect width="1000" height="470" fill="#0d1117"/>
    <rect width="1000" height="44" fill="url(#bar)"/>
    <line x1="0" y1="44" x2="1000" y2="44" stroke="#30363d"/>
    <circle cx="26" cy="22" r="7" fill="#ff5f57"/>
    <circle cx="50" cy="22" r="7" fill="#febc2e"/>
    <circle cx="74" cy="22" r="7" fill="#28c840"/>
    <text x="500" y="27" text-anchor="middle" class="title">thiago@ads: ~/sobre-mim</text>
  </g>
  <rect x="1" y="1" width="998" height="468" rx="15" fill="none" stroke="url(#border)" stroke-width="2" opacity=".75"/>

  <g class="m">
    <text x="30" y="86" class="line l1"><tspan class="prompt">➜ </tspan><tspan class="path">~ </tspan><tspan class="cmd">whoami</tspan></text>
    <text x="30" y="116" class="line l2 out">Thiago <tspan class="hl">—</tspan> estudante de Análise e Desenvolvimento de Sistemas 🎓</text>

    <text x="30" y="160" class="line l3"><tspan class="prompt">➜ </tspan><tspan class="path">~ </tspan><tspan class="cmd">cat sobre.txt</tspan></text>
    <text x="30" y="190" class="line l4 out">🌱 Começando agora no mundo da programação</text>
    <text x="30" y="218" class="line l5 out">🎯 Meta: virar dev e criar projetos que resolvam problemas reais</text>
    <text x="30" y="246" class="line l6 out">🤝 Aberto a estudar junto, trocar ideias e colaborar</text>

    <text x="30" y="290" class="line l7"><tspan class="prompt">➜ </tspan><tspan class="path">~ </tspan><tspan class="cmd">ls aprendendo/</tspan></text>
    <text x="30" y="320" class="line l8" xml:space="preserve"><tspan fill="#f97316">html</tspan>   <tspan fill="#3b82f6">css</tspan>   <tspan fill="#facc15">javascript</tspan>   <tspan fill="#38bdf8">python</tspan>   <tspan fill="#a78bfa">sql</tspan>   <tspan fill="#f43f5e">git</tspan></text>

    <text x="30" y="364" class="line l9"><tspan class="prompt">➜ </tspan><tspan class="path">~ </tspan><tspan class="cmd">echo $LEMA</tspan></text>
    <text x="30" y="394" class="line l10 str">"Todo especialista já foi um iniciante." ✨</text>
  </g>
  <g class="line l11">
    <text x="30" y="438" class="m prompt">➜ </text>
    <text x="52" y="438" class="m path">~ </text>
    <rect x="76" y="422" width="11" height="21" fill="#60a5fa" class="blink"/>
  </g>
</svg>
