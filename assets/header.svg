<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Thiago - Estudante de ADS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#60a5fa;#22d3ee;#a78bfa" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#22d3ee;#a78bfa;#60a5fa" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#60a5fa;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card"><rect x="0" y="0" width="1000" height="320" rx="22"/></clipPath>
    <clipPath id="typing">
      <rect x="332" y="232" width="0" height="34">
        <animate attributeName="width" values="0;378;378;0" keyTimes="0;0.55;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <style>
      .sub { font: 600 21px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #cbd5e1; letter-spacing: .5px; }
      .tag { font: 600 13px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: #e2e8f0; letter-spacing: 1.5px; }
      .mono { font: 500 17px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
      .float1 { animation: f1 9s ease-in-out infinite; }
      .float2 { animation: f2 11s ease-in-out infinite; }
      .float3 { animation: f3 13s ease-in-out infinite; }
      @keyframes f1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(80px,30px); } }
      @keyframes f2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-90px,-20px); } }
      @keyframes f3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,-40px); } }
      .fadeUp { animation: up 1s ease-out both; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .8s; }
      @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .twinkle { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)" opacity=".55"/>

    <!-- brilhos flutuando -->
    <circle class="float1" cx="170" cy="70" r="120" fill="#7c3aed" opacity=".45" filter="url(#blur)"/>
    <circle class="float2" cx="840" cy="250" r="130" fill="#2563eb" opacity=".45" filter="url(#blur)"/>
    <circle class="float3" cx="600" cy="40" r="90" fill="#06b6d4" opacity=".28" filter="url(#blur)"/>

    <!-- estrelinhas -->
    <g fill="#e2e8f0">
      <circle class="twinkle" cx="90" cy="250" r="1.6" style="animation-delay:.3s"/>
      <circle class="twinkle" cx="240" cy="40" r="1.4" style="animation-delay:1.1s"/>
      <circle class="twinkle" cx="420" cy="290" r="1.5" style="animation-delay:.7s"/>
      <circle class="twinkle" cx="760" cy="60" r="1.8" style="animation-delay:1.6s"/>
      <circle class="twinkle" cx="930" cy="130" r="1.4" style="animation-delay:.1s"/>
      <circle class="twinkle" cx="880" cy="290" r="1.5" style="animation-delay:2.2s"/>
      <circle class="twinkle" cx="40" cy="120" r="1.3" style="animation-delay:1.9s"/>
      <circle class="twinkle" cx="660" cy="270" r="1.3" style="animation-delay:2.6s"/>
    </g>
  </g>

  <!-- borda em gradiente -->
  <rect x="1" y="1" width="998" height="318" rx="21" fill="none" stroke="url(#border)" stroke-width="2" opacity=".8"/>

  <!-- selo -->
  <g class="fadeUp">
    <rect x="397" y="34" width="206" height="30" rx="15" fill="#1e1b4b" stroke="#6d28d9" stroke-width="1.2"/>
    <circle cx="418" cy="49" r="4.5" fill="#22c55e"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="432" y="54" class="tag">ESTUDANTE DE ADS</text>
  </g>

  <!-- nome -->
  <g class="fadeUp d1">
    <text x="500" y="142" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="2" fill="url(#nameGrad)" filter="url(#glow)">Thiago</text>
  </g>

  <!-- subtítulo -->
  <g class="fadeUp d2">
    <text x="500" y="186" text-anchor="middle" class="sub">Análise e Desenvolvimento de Sistemas  ·  aprendendo todos os dias</text>
  </g>

  <!-- terminal digitando -->
  <g class="fadeUp d3">
    <rect x="280" y="224" width="440" height="50" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <text x="300" y="255" class="mono" fill="#22c55e">$</text>
    <g clip-path="url(#typing)">
      <text x="332" y="255" class="mono"><tspan fill="#f472b6">git</tspan><tspan fill="#e2e8f0"> commit -m </tspan><tspan fill="#fbbf24">"início da jornada 🚀"</tspan></text>
    </g>
    <rect x="332" y="240" width="10" height="20" fill="#60a5fa" class="blink">
      <animate attributeName="x" values="332;704;704;332" keyTimes="0;0.55;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
